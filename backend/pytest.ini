[pytest]
DJANGO_SETTINGS_MODULE = microtix.settings
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    unit: tes domain murni tanpa DB
    integration: tes PostgreSQL nyata (RLS/transaksi/race)
    contract: tes kontrak API/OpenAPI
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
